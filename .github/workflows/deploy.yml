# Builds the Astro site and publishes it to GitHub Pages
# when main or product-story changes (or when run by hand from the Actions tab).
# A push to product-story also updates main, so the live branch stays current
# without a separate merge.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, product-story]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3
        with:
          # Astro needs Node 22.12 or newer; the action defaults to Node 20
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Keep main level with product-story after the site has published.
  # Pushes made with the workflow token do not start another deploy.
  update-main:
    if: github.ref == 'refs/heads/product-story'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge product-story into main
        run: |
          git fetch origin product-story
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' merge --no-ff origin/product-story -m "Update main from product-story"
          git push origin HEAD:main
